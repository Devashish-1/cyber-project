services:
  postgres:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    read_only: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?Set CONTROL_PLANE_TOKEN in .env}
      CONTROL_PLANE_VIEWER_TOKEN: ${CONTROL_PLANE_VIEWER_TOKEN:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env}
      TOOL_REGISTRY_PATH: /app/config/tools.yaml
      ADAPTERS_PATH: /app/config/adapters.yaml
      EVIDENCE_ROOT: /evidence/runs
      SOURCE_ROOT: /sources
      IMAGE_AUDIT_ROOT: /image-audits
      BACKUP_ROOT: /backups
      VALIDATION_STATUS_PATH: /validation/local-validation-suite.json
      DEPLOYMENT_SECURITY_STATUS_PATH: /validation/deployment-security-status.json
      MIN_STORAGE_FREE_BYTES: ${MIN_STORAGE_FREE_BYTES:-10737418240}
      MAX_STORAGE_USED_PERCENT: ${MAX_STORAGE_USED_PERCENT:-90}
      MAX_PENDING_RUNS: ${MAX_PENDING_RUNS:-100}
      MAX_TOOL_OUTPUT_BYTES: ${MAX_TOOL_OUTPUT_BYTES:-16777216}
      MAX_TOOL_LOG_BYTES: ${MAX_TOOL_LOG_BYTES:-2097152}
      MAX_TOOL_LOG_LINES: ${MAX_TOOL_LOG_LINES:-20000}
      MAX_RUN_EVIDENCE_BYTES: ${MAX_RUN_EVIDENCE_BYTES:-67108864}
      MAX_RUN_EVIDENCE_FILES: ${MAX_RUN_EVIDENCE_FILES:-32}
    volumes:
      - ./config:/app/config:ro
      - ./evidence:/evidence:ro
      - ./data/sources:/sources
      - ./data/exports/image-audits:/image-audits:ro
      - ./backups:/backups:ro
      - ./data/tmp:/validation:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777

  runner:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.runner"]
    user: "${LOCAL_UID:-1000}:${DOCKER_GID:-999}"
    read_only: true
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env}
      ADAPTERS_PATH: /app/config/adapters.yaml
      EVIDENCE_ROOT: /evidence/runs
      SOURCE_ROOT: /sources
      SOURCE_HOST_ROOT: /home/killswitch/security-platform/data/sources
      CODEQL_CACHE_HOST_PATH: /home/killswitch/security-platform/data/codeql-cache
      KUBESCAPE_POLICY_HOST_PATH: /home/killswitch/security-platform/config/kubescape/nsa.json
      MAX_TOOL_OUTPUT_BYTES: ${MAX_TOOL_OUTPUT_BYTES:-16777216}
      MAX_TOOL_LOG_BYTES: ${MAX_TOOL_LOG_BYTES:-2097152}
      MAX_TOOL_LOG_LINES: ${MAX_TOOL_LOG_LINES:-20000}
      MAX_RUN_EVIDENCE_BYTES: ${MAX_RUN_EVIDENCE_BYTES:-67108864}
      MAX_RUN_EVIDENCE_FILES: ${MAX_RUN_EVIDENCE_FILES:-32}
    volumes:
      - ./config:/app/config:ro
      - ./evidence:/evidence
      - ./data/sources:/sources:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=${LOCAL_UID:-1000},gid=${DOCKER_GID:-999},mode=1777

  dashboard:
    image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    user: "101:101"
    read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=16m,uid=101,gid=101,mode=0755
      - /var/run:rw,nosuid,nodev,noexec,size=4m,uid=101,gid=101,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=101,gid=101,mode=1777
