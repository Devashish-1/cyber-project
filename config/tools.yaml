profiles:
  observe: {description: Passive production checks, max_concurrency: 2, tools: [httpx, testssl, zap-passive]}
  controlled-active: {description: Reviewed active checks, max_concurrency: 1, tools: [subfinder, dnsx, katana, nuclei-reviewed, zap-baseline, nikto, schemathesis]}
  extended-active: {description: Operator-approved validation, max_concurrency: 1, requires_operator: true, tools: [feroxbuster, ffuf, arjun, zap-full, sqlmap-controlled, dalfox]}
  source-assisted: {description: Source and supply-chain checks, max_concurrency: 2, tools: [semgrep, bandit, njsscan, brakeman, syft, grype, trivy, gitleaks, trufflehog, osv-scanner, checkov, kics, hadolint, shellcheck]}

tools:
  amass: {category: recon, risk: medium, availability: optional, execution: external-service-gated, automation_note: "Passive enumeration contacts third-party data sources; require provider/scope approval before automation."}
  subfinder: {category: recon, risk: low, availability: core, execution: adapter}
  theharvester: {category: osint, risk: medium, availability: optional, execution: external-service-gated, automation_note: "Queries third-party search and intelligence providers; require provider terms and scope approval."}
  spiderfoot: {category: osint, risk: medium, availability: optional, execution: external-service-gated, automation_note: "Only the crt.sh module is automated; explicit provider/scope approval is required and identity data is not retained."}
  recon-ng: {category: osint, risk: medium, availability: optional, execution: manual}
  sherlock: {category: osint, risk: low, availability: optional, execution: manual}
  maigret: {category: osint, risk: low, availability: optional, execution: manual}
