adapters:
  subfinder:
    version: v2.16.0
    image: projectdiscovery/subfinder@sha256:c0f4683f91e8e30fbb5bf45051ef45e245ef48424b0d5bc99f8a72cb45163ea9
    profile: controlled-active
    approval: domain-scope-required
    timeout_seconds: 360
    resources: {cpus: 0.5, memory: 512m, pids: 128}
    output: jsonl
    capabilities: [passive-subdomain-discovery, source-attribution]
    controls: [domain-only, scope-filtered-output, rate-limit-5, max-time-5-minutes]
    state: verified-image

  httpx:
    version: v1.12.0
    image: projectdiscovery/httpx@sha256:f8275a7c6aaec187249df9eaf4ad9196f4677adfc6a51a47b4aaa1d4db4f8ffc
    profile: observe
    approval: scope-required
    timeout_seconds: 600
    resources: {cpus: 0.5, memory: 512m, pids: 128}
    output: jsonl
    capabilities: [status-code, title, technology, tls, redirect, ip, cname]
    state: verified-image

  katana:
    version: v1.7.0
    image: projectdiscovery/katana@sha256:4e9fce12c507e1ca455baf493e14b899db5f2e0ed22ba62591aa42300487a947
    profile: controlled-active
    approval: scope-required
    timeout_seconds: 180
    resources: {cpus: 0.75, memory: 768m, pids: 128}
    output: sanitized-jsonl
    capabilities: [same-host-crawl, endpoint-discovery, response-metadata]
    controls: [depth-2, duration-2-minutes, rate-limit-5, fqdn-scope, excluded-paths, omit-raw, omit-body]
    state: verified-image

  nikto:
    version: 2.6.1
    image: ghcr.io/sullo/nikto@sha256:f65dd97be358e8260d97a00e784c05c5f37d2ed69b9a9611b14d3889c2b54efa
    profile: controlled-active
    approval: scope-required
    timeout_seconds: 360
    resources: {cpus: 0.75, memory: 768m, pids: 128}
    output: text-normalized
    capabilities: [interesting-files, misconfiguration, information-disclosure]
    controls: [tuning-1-2-3-only, pause-50ms, max-time-5-minutes, no-update, no-interactive]
    state: verified-image

  wapiti:
    version: 3.3.2
    image: security-platform/wapiti:3.3.2
    profile: extended-active
    approval: explicit-run-and-scope-required
    timeout_seconds: 180
    resources: {cpus: 1.0, memory: 1g, pids: 192}
    output: json
    capabilities: [technology-fingerprint, http-methods, csrf-review]
    controls: [explicit-modules, url-scope, duration-2-minutes, tasks-2, no-bugreport]
    state: local-hardened-image

  nuclei-reviewed:
    version: v3.11.1
    image: projectdiscovery/nuclei@sha256:582d5546902e67052097cb2d07296c642d50a1afc5e44623cb038845df9a32eb
    profile: controlled-active
    approval: template-review-and-scope-required
    timeout_seconds: 1800
    resources: {cpus: 1.0, memory: 1g, pids: 256}
    output: jsonl
    templates:
      - http/technologies/tech-detect.yaml
      - http/technologies/nginx/default-nginx-page.yaml
      - http/misconfiguration/http-missing-security-headers.yaml
    controls: [signed-templates-only, explicit-template-allowlist, rate-limit-5, concurrency-2, no-interactsh]
    state: verified-image

  testssl:
    version: 3.2.4
    image: ghcr.io/testssl/testssl.sh@sha256:31213829a371e90afc9beae12a715793190aecebe9b64488ea49f72de7ff3c62
    profile: observe
    approval: scope-required
    timeout_seconds: 900
    resources: {cpus: 0.75, memory: 768m, pids: 128}
    output: json-pretty
    capabilities: [protocols, ciphers, certificate, vulnerabilities, headers]
    state: verified-image

  zap-baseline:
    version: 2.17.0
    image: security-platform/zap-runner:2.17.0
    profile: observe
    approval: scope-required
    timeout_seconds: 1200
    resources: {cpus: 1.5, memory: 4g, pids: 512}
    output: [json, html]
    controls: [baseline-only, passive-rules, spider-time-limit, no-active-scan]
    state: local-hardened-image

  zap-full:
    version: 2.17.0
    image: security-platform/zap-runner:2.17.0
    profile: extended-active
    approval: explicit-run-and-scope-required
    timeout_seconds: 1200
    resources: {cpus: 2.0, memory: 6g, pids: 512}
    output: json
    controls: [active-scan, spider-time-limit, total-time-limit, rate-bounded, operator-cancellable]
    state: local-hardened-image
