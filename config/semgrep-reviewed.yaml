rules:
  - id: python-dangerous-eval-exec
    message: Dynamic code execution can allow attacker-controlled input to run as Python code.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
    metadata:
      category: security
      cwe: CWE-95
      owasp: A03:2021-Injection

  - id: python-subprocess-shell-true
    message: A subprocess launched through a shell can enable command injection when arguments are untrusted.
    severity: ERROR
    languages: [python]
    pattern: subprocess.$FUNC(..., shell=True, ...)
    metadata:
      category: security
      cwe: CWE-78
      owasp: A03:2021-Injection

  - id: flask-debug-enabled
    message: Flask debug mode must not be enabled in a deployed application.
    severity: WARNING
    languages: [python]
    pattern: $APP.run(..., debug=True, ...)
    metadata:
      category: security
      cwe: CWE-489
      owasp: A05:2021-Security Misconfiguration

  - id: javascript-child-process-exec
    message: Direct child_process.exec usage can enable OS command injection when input is untrusted.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: require('child_process').exec(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $CP = require('child_process');
                  ...
              - pattern-inside: |
                  let $CP = require('child_process');
                  ...
              - pattern-inside: |
                  var $CP = require('child_process');
                  ...
          - pattern: $CP.exec(...)
    metadata:
      category: security
      cwe: CWE-78
      owasp: A03:2021-Injection
